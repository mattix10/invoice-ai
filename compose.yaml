name: invoiceflow

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy apps/backend/.env.example to apps/backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the local PostgreSQL password}
      POSTGRES_DB: ${POSTGRES_DB:?Set the local PostgreSQL database}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./apps/backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres-test:
    image: postgres:17
    profiles: ["test"]
    environment:
      POSTGRES_USER: invoiceflow_test
      POSTGRES_PASSWORD: test_only
      POSTGRES_DB: invoiceflow_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoiceflow_test -d invoiceflow_test"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
