name: Quality gates

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run arch:test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --watch=false
      - run: npm run build

  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: invoiceflow_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: invoiceflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoiceflow_test -d invoiceflow_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://invoiceflow_test:test_only@localhost:5432/invoiceflow_test
      TEST_DATABASE_URL: postgresql+psycopg://invoiceflow_test:test_only@localhost:5432/invoiceflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock
      - run: uv sync --locked --python 3.13
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest tests/unit
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest tests/integration
      - name: Build backend image
        run: docker build -t invoiceflow-backend:ci .
      - name: Build and test isolated OCR worker
        run: |
          docker build -f Dockerfile.ocr -t invoiceflow-ocr:ci .
          container=$(docker run -d --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 512m --cpus 1 --pids-limit 32 \
            --tmpfs /tmp:size=256m,noexec,nosuid,nodev \
            --tmpfs /spool:uid=10001,gid=10001 invoiceflow-ocr:ci)
          trap 'docker rm -f "$container"' EXIT
          uv run python tests/docker/verify_isolation.py "$container"
          uv run python tests/docker/smoke_documents.py "$container"
