name: Free AI code review

on:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: free-ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.FREE_AI_REVIEW_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Only trusted base code; never checkout the PR head or merge ref.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            prompts
      - name: Analyze untrusted diff as data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FREE_AI_REVIEW_MODEL: ${{ vars.FREE_AI_REVIEW_MODEL }}
        run: python3 .github/scripts/free_ai_review.py analyze --report "$RUNNER_TEMP/ai-review/report.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ai-review/report.json
          retention-days: 1
          if-no-files-found: error
      - name: Report actual AI analysis outcome
        run: python3 .github/scripts/free_ai_review.py status --report "$RUNNER_TEMP/ai-review/report.json"

  publish:
    needs: analyze
    # Publish the saved failure report even when the analysis outcome is red.
    if: ${{ !cancelled() && (needs.analyze.result == 'success' || needs.analyze.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ai-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ai-review
      - name: Validate and update advisory comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/free_ai_review.py publish --report "$RUNNER_TEMP/ai-review/report.json"
      - name: Report actual AI review outcome
        run: python3 .github/scripts/free_ai_review.py status --report "$RUNNER_TEMP/ai-review/report.json"
