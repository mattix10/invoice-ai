<form #editor="ngForm" novalidate (ngSubmit)="save.emit(form())">
  <fieldset [disabled]="busy()">
    <section [hidden]="step() !== 1" aria-labelledby="upload-heading">
      <h2 id="upload-heading" tabindex="-1">Invoice uploaded</h2>
      <p class="intro">Your document is ready. Continue to review its fields.</p>
    </section>
    <app-draft-fields
      [hidden]="step() !== 2"
      [draft]="form()"
      [documentId]="documentId()"
      [busy]="busy()"
      (changed)="patchDraft($event)"
      (apply)="applySuggestions($event)"
      (decide)="decide.emit($event)"
    />
    <app-draft-items-editor
      [hidden]="step() !== 3"
      [draft]="form()"
      (changed)="patchDraft($event)"
    />
    <app-draft-summary
      [hidden]="step() !== 4"
      [draft]="form()"
      [validation]="validation()"
      (stepChange)="stepChange.emit($event)"
    />
    @if (validation().errors.length) {
      <app-draft-validation [errors]="validation().errors" />
    }
    <div class="footer">
      @if (step() > 1) {
        <button type="button" (click)="stepChange.emit(step() - 1)">← Back</button>
      } @else {
        <button type="button" disabled>← Back</button>
      }
      <div class="button-group">
        <button class="btn" type="submit" [disabled]="busy()">Save draft</button>
        @if (step() < 4) {
          <button class="btn btn-primary" type="button" (click)="stepChange.emit(step() + 1)">
            Continue →
          </button>
        } @else {
          <button
            class="btn btn-primary"
            type="button"
            [disabled]="busy()"
            (click)="confirm.emit(form())"
          >
            Confirm invoice →
          </button>
        }
      </div>
    </div>
  </fieldset>
</form>
