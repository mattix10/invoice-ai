<app-panel class="comparison-card"
  ><section class="panel" aria-labelledby="comparison-title">
    <h2 id="comparison-title">Line items and PO comparison</h2>
    <p class="section-note">Net amounts · {{ data().invoice.purchaseOrder }}</p>
    @if (itemRows().length) {
      <app-invoice-comparison-table
        label="Line items and purchase order comparison"
        [headers]="itemHeaders"
        [rows]="itemRows()"
        [positions]="itemPositions()"
      />
    } @else {
      <p class="empty-items">No invoice line items are available to compare.</p>
    }
    <details class="comparison-totals">
      <summary>Invoice and purchase order totals</summary>
      <app-invoice-comparison-table
        class="comparison-totals"
        label="Invoice and purchase order totals"
        [headers]="totalHeaders"
        [rows]="totalRows()"
      />
    </details></section
></app-panel>
