<header class="page-header">
  <div>
    <h1>AI investigation</h1>
    <p>Review reconciliation evidence with your invoice copilot.</p>
  </div>
  <a class="back-link" [routerLink]="['/invoices', session.invoiceId()]">← Back to invoice</a>
</header>
<div class="layout">
  <app-reconciliation-evidence-card
    [invoiceId]="session.invoiceId()"
    [state]="session.state()"
    [reconciliationMissing]="session.reconciliationMissing()"
    [result]="session.result()"
    [selectedRevision]="session.selectedRevision()"
    (retry)="session.load()"
  />
  <app-copilot-panel
    [answer]="session.answer()"
    [sources]="session.sources()"
    [state]="session.answerState()"
    [error]="session.answerError()"
    [historical]="
      session.selectedRevision() || (!!session.result() && !session.result()?.isCurrent)
    "
    [evidenceLoading]="session.state() === 'loading'"
    [lastQuestion]="session.lastQuestion()"
    (submitted)="session.ask($event)"
    (retry)="session.retryAnswer()"
  />
</div>
<app-supplier-inquiry [invoiceId]="session.invoiceId()" [record]="session.result()" />
