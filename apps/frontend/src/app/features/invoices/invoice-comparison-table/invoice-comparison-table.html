<table [attr.aria-label]="label()" [class.line-items]="positions().length > 0">
  <thead>
    <tr>
      @for (header of headers(); track $index) {
        <th scope="col">{{ header }}</th>
      }
    </tr>
  </thead>
  <tbody>
    @for (row of rows(); track $index) {
      <tr
        [attr.id]="
          positions()[$index] !== undefined ? 'comparison-line-' + positions()[$index] : null
        "
        [attr.tabindex]="positions()[$index] !== undefined ? -1 : null"
      >
        @for (cell of row; track $index) {
          <td [attr.data-label]="headers()[$index]">{{ cell }}</td>
        }
      </tr>
    }
  </tbody>
</table>
