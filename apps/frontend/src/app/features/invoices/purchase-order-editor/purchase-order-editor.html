<form (ngSubmit)="saved.emit(form)" #poForm="ngForm">
  <h3>{{ mode() === 'create' ? 'Create fictional PO' : 'Edit PO' }}</h3>
  <label
    >Reference <input name="reference" [(ngModel)]="form.externalReference" required maxlength="64"
  /></label>
  <label
    >Supplier <input name="supplier" [(ngModel)]="form.supplier" required maxlength="255"
  /></label>
  <label
    >Currency <input name="currency" [(ngModel)]="form.currency" required pattern="[A-Z]{3}"
  /></label>
  <label
    >VAT rate (for example 0.23) <input name="vat" [(ngModel)]="form.vatRate" required
  /></label>
  @for (item of form.items; track $index; let index = $index) {
    <fieldset>
      <legend>PO line {{ index + 1 }}</legend>
      <label
        >Position
        <input
          type="number"
          [name]="'position' + index"
          [(ngModel)]="item.position"
          min="1"
          step="1"
          required
      /></label>
      <label
        >Description
        <input
          [name]="'description' + index"
          [(ngModel)]="item.description"
          required
          maxlength="255"
      /></label>
      <label
        >Quantity
        <input
          type="number"
          [name]="'quantity' + index"
          [(ngModel)]="item.quantity"
          min="1"
          step="1"
          required
      /></label>
      <label
        >Unit net
        <input
          [name]="'unitNet' + index"
          [(ngModel)]="item.unitNet"
          pattern="[0-9]+\.[0-9]{2}"
          required
      /></label>
      <button
        class="text-action"
        type="button"
        (click)="removeItem(index)"
        [disabled]="form.items.length === 1"
      >
        Remove line
      </button>
    </fieldset>
  }
  <div class="actions">
    <button class="btn btn-primary" type="submit" [disabled]="busy() || poForm.invalid">
      Save PO
    </button>
    <button class="btn" type="button" (click)="cancelled.emit()">Cancel</button>
    <button class="text-action" type="button" (click)="addItem()">+ Add line</button>
  </div>
</form>
