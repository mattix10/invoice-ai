<aside aria-label="Main navigation">
  <a class="brand" routerLink="/overview" aria-label="InvoiceAI overview"
    ><span class="mark" aria-hidden="true">▥</span
    ><span class="brand-label"
      >InvoiceAI<span class="dot">.</span><small>AI finance workspace</small></span
    ></a
  >
  <div class="caption">WORKSPACE</div>
  <nav aria-label="Sections">
    @for (item of links; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.path !== '/overview' }"
        ariaCurrentWhenActive="page"
        [title]="item.label"
        ><svg
          viewBox="0 0 24 24"
          aria-hidden="true"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path [attr.d]="item.icon" /></svg
        ><span class="nav-label">{{ item.label }}</span></a
      >
    }
  </nav>
  <div class="bottom">
    <div class="note">
      <span aria-hidden="true">●</span>
      <div><strong>Design preview</strong><small>Sample data · no backend</small></div>
    </div>
    <div class="person">
      <span class="avatar">JD</span>
      <div><strong>Jordan Davis</strong><small>Finance Operations</small></div>
    </div>
  </div>
</aside>
